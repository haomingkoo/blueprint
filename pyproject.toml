[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
# Baseline lint: catch syntax errors and undefined names without turning the
# current codebase into a noisy style migration.
select = ["E9", "F63", "F7", "F82"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["analyzer"]
