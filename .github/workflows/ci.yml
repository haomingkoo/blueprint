name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyzer-quality:
    name: Analyzer + server lint, type check, tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest httpx ruff==0.15.20 ty==0.0.56
          python -m pip install -r server/requirements.txt

      - name: Compile analyzer + server
        run: python -m compileall -q analyzer server

      - name: Ruff critical checks
        run: ruff check analyzer server

      - name: ty baseline type check
        run: ty check --output-format github

      - name: Analyzer + server tests
        run: python -m pytest analyzer server -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
